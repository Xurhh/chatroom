apiVersion: v1
kind: ConfigMap
metadata: { name: chat-config }
data:
  APP_ENV: "prod"
  REDIS_ADDR: "redis-master.chat-infra.svc:6379"
  ALLOWED_ORIGINS: "https://chat.example.com"
  GOMEMLIMIT: "450MiB"
---
apiVersion: v1
kind: Secret
metadata: { name: chat-secret }
stringData:
  JWT_SECRET: "<openssl rand -hex 32>"
