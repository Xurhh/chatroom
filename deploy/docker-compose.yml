# 本地开发依赖：redis + 应用（可选，平时用 `make run` 直接跑也行）
#
#   docker compose -f deploy/docker-compose.yml up -d redis   # 只起 Redis
#   docker compose -f deploy/docker-compose.yml up --build     # 连应用一起起
services:
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      # 聊天历史是权威数据：不允许被 LRU 静默驱逐（guide 4.5）
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_ENV: dev
      REDIS_ADDR: redis:6379
      ALLOWED_ORIGINS: http://localhost:5173
      JWT_SECRET: dev-only-secret-change-me
      PPROF_ADDR: ""
    ports:
      - "8080:8080"

volumes:
  redis-data: